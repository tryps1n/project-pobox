<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Letter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=IM+Fell+English:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="inbox.css">
    <link rel="stylesheet" href="letter.css">
    <link rel="stylesheet" href="envelope.css">
    <link rel="icon" href="flower.png">
</head>
<body data-page="letter">

    <div class="parchment-bg"></div>
    <div class="vignette"></div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="app.js"></script>

    <div class="layout">

        <!-- ── Sidebar ── -->
        <aside class="sidebar">
            <div class="sidebar-title">
                <a href="/" class="logo">
                    <img src="logo.png" alt="logo-image" class="logo-image" height="40">
                </a>
                <span class="pinyon">P.O. Box</span>
            </div>
            <nav class="sidebar-nav">
                <a href="inbox.html" class="nav-item">
                    <span class="nav-icon">✉</span>
                    <span class="nav-label">Inbox</span>
                    <span class="unread-badge" id="unread-count"></span>
                </a>
                <a href="compose.html" class="nav-item">
                    <span class="nav-icon">✒</span>
                    <span class="nav-label">Compose</span>
                </a>
                <a href="partner.html" class="nav-item">
                    <span class="nav-icon">❤</span>
                    <span class="nav-label">Partner</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout" onclick="logout()">— Sign out</button>
            </div>
        </aside>

        <!-- ── Letter content ── -->
        <main class="main">

            <a href="inbox.html" class="back-link">← Back to Inbox</a>

            <!-- shown while JS fetches the letter -->
            <div id="letter-loading" class="loading-state">
                <span class="loading-ornament">❧</span>
                <p>Loading Letter...</p>
            </div>

            <!-- envelope shown after loading, before opening -->
            <div class="envelope-scene" id="envelope-scene" style="display:none">
                <div class="envelope" id="envelope">
                    <div class="envelope-flap">
                        <div class="envelope-sender" id="envelope-sender">
                        <span class="envelope-sender-name" id="env-sender-name"></span>
                        <span class="envelope-sender-date" id="env-sender-date"></span>
                        </div>
                    </div>
                    <div class="envelope-folds">
                        <div class="envelope-left"></div>
                        <div class="envelope-right"></div>
                        <div class="envelope-bottom"></div>
                    </div>
                    <div class="envelope-stamp">✦</div>
                    <div class="envelope-unread-dot" id="unread-dot"></div>
                    
                    <button class="envelope-open-btn" id="openEnvelope" aria-label="Open letter">
                        <span>Open</span>
                    </button>
                </div>
            </div>

            <!-- the actual letter, hidden until envelope is opened -->
            <article class="letter-paper" id="letter-paper" style="display:none">

                <div class="fold-line"></div>

                <header class="letter-head">
                    <div class="letter-meta-row">
                        <span class="letter-label">To</span>
                        <span class="letter-to" id="letter-to"></span>
                    </div>
                    <div class="letter-meta-row">
                        <span class="letter-label">From</span>
                        <span class="letter-from" id="letter-from"></span>
                    </div>
                    <div class="letter-meta-row">
                        <span class="letter-label">Date</span>
                        <span class="letter-date" id="letter-date"></span>
                    </div>
                    <div class="letter-divider">
                        <span class="divider-ornament">— ✦ —</span>
                    </div>
                    <h1 class="letter-subject" id="letter-subject"></h1>
                </header>

                <section class="letter-body" id="letter-body"></section>

                <footer class="letter-footer">
                    <div class="letter-divider" style="margin-bottom: 24px;">
                        <span class="divider-ornament">— ✦ —</span>
                    </div>
                    <p class="letter-sign-off">Yours truly,</p>
                    <p class="letter-signature" id="letter-signature"></p>
                </footer>

                <div class="corner-seal">✦</div>

            </article>

        </main>
    </div>

</body>
</html>
