<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>P.O. Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=IM+Fell+English:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="flower.png">
</head>
<body>

    <div class="parchment-bg"></div>
    <div class="vignette"></div>

    <!-- load scripts here -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="app.js"></script>

    <!-- site header stuff -->
    <header class="site-header">
        <img src="logo.png" class="title-logo" height="90">
        <h1 class="site-title">P.O. Box</h1>
    </header>

    <div id="login-section">
        <div class="form-card">
            <div class="wax-seal">✦</div>
            <h2 class="form-title">Welcome Back</h2>
            <p class="form-subtitle"><em>Sign in to read your letters</em></p>
            <div class="field-group">
                <label class="field-label">Email Address</label>
                <input type="email" id="loginEmail" placeholder="your@email.com">
            </div>
            <div class="field-group">
                <label class="field-label">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="login()">Sign In</button>
            <button class="btn-ghost" onclick="loadRegister()">New correspondence? Register</button>
        </div>
    </div>

    <div id="register-section" style="display: none">
        <div class="form-card">
            <div class="wax-seal">✦</div>
            <h2 class="form-title">Create Account</h2>
            <p class="form-subtitle"><em>Create your account</em></p>
            <div class="field-group">
                <label class="field-label">Email Address</label>
                <input type="email" id="registerEmail" placeholder="your@email.com">
            </div>
            <div class="field-group">
                <label class="field-label">Your Name</label>
                <input type="user" id="registerUser" placeholder="How shall you be known?">
            </div>
            <div class="field-group">
                <label class="field-label">Password</label>
                <input type="password" id="registerPassword" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="register()">Begin</button>
            <button class="btn-ghost" onclick="loadLogin()">Already registered? Sign in</button>
        </div>
    </div>
    
</body>
</html>
