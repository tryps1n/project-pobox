<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Partner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=IM+Fell+English:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="inbox.css">
    <link rel="stylesheet" href="partner.css">
    <link rel="icon" href="flower.png">
</head>
<body data-page="partner">

    <div class="parchment-bg"></div>
    <div class="vignette"></div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="app.js"></script>

    <div class="layout">

        <aside class="sidebar">
            <div class="sidebar-title">
                <a href="/" class="logo">
                    <img src="logo.png" alt="logo-image" class="logo-image" height="40">
                </a>
                <span class="pinyon">P.O. Box</span>
            </div>
            <nav class="sidebar-nav">
                <a href="inbox.html" class="nav-item">
                    <span class="nav-icon">✉</span>
                    <span class="nav-label">Inbox</span>
                    <span class="unread-badge" id="unread-count"></span>
                </a>
                <a href="compose.html" class="nav-item">
                    <span class="nav-icon">✒</span>
                    <span class="nav-label">Compose</span>
                </a>
                <a href="partner.html" class="nav-item active">
                    <span class="nav-icon">♡</span>
                    <span class="nav-label">Partner</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout" onclick="logout()">— Sign out</button>
            </div>
        </aside>

        <main class="main">

            <header class="inbox-header">
                <div class="inbox-header-left">
                    <h1 class="inbox-title">Partner</h1>
                    <span class="inbox-subtitle" id="partner-subtitle">your correspondence partner</span>
                </div>
                <div class="header-rule">❧</div>
            </header>

            <div class="partner-card" id="partner-status">
                <div class="partner-card-loading">
                    <span class="loading-ornament">❧</span>
                </div>
            </div>

            <div class="section-block" id="request-section">
                <h2 class="section-title">Send a Request</h2>
                <p class="section-desc">Enter your partner's email to invite them to pair up with you.</p>
                <div class="request-row">
                    <input
                        type="email"
                        id="partnerEmailInput"
                        class="partner-input"
                        placeholder="their@email.com"
                    >
                    <button class="btn-send-request" onclick="sendPartnerRequest(this)">
                        Send
                    </button>
                </div>
                <p class="request-hint" id="request-hint"></p>
            </div>

            <!-- incoming requests -->
            <div class="section-block">
                <h2 class="section-title">Incoming Requests</h2>
                <div id="requests-list">
                    <div class="empty-requests" id="empty-requests">
                        <p>No pending requests.</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
